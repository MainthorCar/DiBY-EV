name = "diby-ev"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CHARGER"
class_name = "Charger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Charger"]

[vars]
# Página que puede hablar con el servidor
ALLOWED_ORIGIN = "https://mainthorcar.github.io"
# Hora de Argentina (UTC-3), en minutos
TZ_OFFSET_MIN = "-180"

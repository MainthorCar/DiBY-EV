name: Publicar servidor

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/servidor.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            OCPP_PASSWORD
            PANEL_PASSWORD
        env:
          OCPP_PASSWORD: ${{ secrets.OCPP_PASSWORD }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}

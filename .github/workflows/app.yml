name: Armar app Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Firma (secreto KS_B64 si existe)
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $RUNNER_TEMP/diby.jks; echo "KS_FILE=$RUNNER_TEMP/diby.jks" >> $GITHUB_ENV; fi

      - name: Armar APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          gradle -p android assembleRelease -PvCode=${{ github.run_number }} --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk DiBY-EV.apk

      - name: Publicar en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: DiBY EV 1.${{ github.run_number }}
          body: |
            App Android de DiBY EV, versión 1.${{ github.run_number }}.
            Descargar en el teléfono: https://github.com/MainthorCar/DiBY-EV/releases/latest/download/DiBY-EV.apk
          files: DiBY-EV.apk
          make_latest: true
